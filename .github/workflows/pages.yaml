# 建構並部署 Hugo 網站到 GitHub Pages 的範例工作流程
name: 部署 Hugo 網站到 Pages

on:
  # 針對預設分支的推送觸發
  push:
    branches: ["main"]

  # 允許從 Actions 分頁手動執行
  workflow_dispatch:

# 設定 GITHUB_TOKEN 權限以允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 僅允許一個並行部署，跳過正在執行與最新排隊之間的執行
# 但不會取消進行中的執行，以確保正式環境部署完成
concurrency:
  group: "pages"
  cancel-in-progress: false

# 預設使用 bash
defaults:
  run:
    shell: bash

jobs:
  # 建構任務
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.1

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 取得完整歷史記錄以支援 .GitInfo 與 .Lastmod
          submodules: recursive

      - name: 設定 Go 環境
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 設定 GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: 安裝 Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: 使用 Hugo 建構網站
        env:
          # 為 Hugo Modules 提供最大相容性
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production

        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上傳建構產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # 部署任務
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4